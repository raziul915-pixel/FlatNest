<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlatNest - Booking Requests</title>
    <link rel="icon" type="image/jpeg" href="FlatNest.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="bookings">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="FlatNest.jpg" alt="FlatNest Logo" class="brand-logo" />
          <div class="brand-info">
            <h2>FlatNest</h2>
            <p id="agentName">Samiya Sultana</p>
            <span>Sales Agent</span>
          </div>
        </div>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="inquiries.html">Inquiries</a>
          <a href="visits.html">Site Visits</a>
          <a href="bookings.html" class="active">Booking Requests</a>
          <a href="customers.html">My Customers</a>
        </nav>
        <div class="sidebar-footer">
          <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <h1>Booking Requests</h1>
            <p class="subtitle">Confirm or cancel bookings. The flat status updates automatically.</p>
          </div>
          
        </header>
        <section class="card">
          <div class="toolbar">
            <input type="text" id="bookingSearch" placeholder="Search customer or flat" />
            <select id="bookingStatusFilter">
              <option value="All">All Status</option><option value="Pending">Pending</option><option value="Confirmed">Confirmed</option><option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Customer</th><th>Flat</th><th>Price</th><th>Requested On</th><th>Status</th><th>Flat Status</th><th>Action</th></tr></thead>
              <tbody id="bookingTableBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
