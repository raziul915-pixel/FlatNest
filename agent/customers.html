<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlatNest - My Customers</title>
    <link rel="icon" type="image/jpeg" href="FlatNest.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="customers">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="FlatNest.jpg" alt="FlatNest Logo" class="brand-logo" />
          <div class="brand-info">
            <h2>FlatNest</h2>
            <p id="agentName">Samiya Sultana</p>
            <span>Sales Agent</span>
          </div>
        </div>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="inquiries.html">Inquiries</a>
          <a href="visits.html">Site Visits</a>
          <a href="bookings.html">Booking Requests</a>
          <a href="customers.html" class="active">My Customers</a>
        </nav>
        <div class="sidebar-footer">
          <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <h1>My Customers</h1>
            <p class="subtitle">Assigned customers, booking progress and private follow-up notes.</p>
          </div>
          
        </header>
        <section class="card">
          <div class="toolbar">
            <input type="text" id="customerSearch" placeholder="Search name, phone or email" />
            <select id="customerStageFilter">
              <option value="All">All Stages</option><option value="1">Inquiry</option><option value="2">Visited</option><option value="3">Booking Requested</option><option value="4">Booking Confirmed</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Customer</th><th>Contact</th><th>Flats of Interest</th><th>Booking Progress</th><th>Notes</th><th>Action</th></tr></thead>
              <tbody id="customerTableBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
    <div id="notesModal" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="notesTitle">Private Follow-up Notes</h3>
          <button type="button" class="modal-close" id="closeNotesBtn">&times;</button>
        </div>
        <p class="modal-subtitle" id="notesSubtitle"></p>
        <div class="field"><label>Saved Notes</label><div id="notesList" class="notes-list"></div></div>
        <div class="field">
          <label for="noteInput">Add Note</label>
          <textarea id="noteInput" rows="3" placeholder="Visible only to you"></textarea>
          <span class="field-error" id="noteError"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelNotesBtn">Cancel</button>
          <button type="button" class="btn-primary" id="addNoteBtn">Add Note</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
