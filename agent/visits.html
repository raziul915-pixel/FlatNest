<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlatNest - Site Visit Requests</title>
    <link rel="icon" type="image/jpeg" href="FlatNest.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="visits">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="FlatNest.jpg" alt="FlatNest Logo" class="brand-logo" />
          <div class="brand-info">
            <h2>FlatNest</h2>
            <p id="agentName">Samiya Sultana</p>
            <span>Sales Agent</span>
          </div>
        </div>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="inquiries.html">Inquiries</a>
          <a href="visits.html" class="active">Site Visits</a>
          <a href="bookings.html">Booking Requests</a>
          <a href="customers.html">My Customers</a>
        </nav>
        <div class="sidebar-footer">
          <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <h1>Site Visit Requests</h1>
            <p class="subtitle">Accept, reschedule or complete customer site visits.</p>
          </div>
          
        </header>
        <section class="card">
          <div class="toolbar">
            <input type="text" id="visitSearch" placeholder="Search customer or flat" />
            <select id="visitStatusFilter">
              <option value="All">All Status</option><option value="Pending">Pending</option><option value="Accepted">Accepted</option><option value="Rescheduled">Rescheduled</option><option value="Completed">Completed</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Customer</th><th>Flat</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="visitTableBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
    <div id="rescheduleModal" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="rescheduleTitle">Reschedule Site Visit</h3>
          <button type="button" class="modal-close" id="closeRescheduleBtn">&times;</button>
        </div>
        <p class="modal-subtitle" id="rescheduleSubtitle"></p>
        <div class="form-grid">
          <div class="field"><label for="rescheduleDate">New Date</label><input type="date" id="rescheduleDate" /><span class="field-error" id="rescheduleDateError"></span></div>
          <div class="field"><label for="rescheduleTime">New Time</label><input type="time" id="rescheduleTime" /><span class="field-error" id="rescheduleTimeError"></span></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelRescheduleBtn">Cancel</button>
          <button type="button" class="btn-primary" id="saveRescheduleBtn">Save Schedule</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
