<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Reset Password | FlatFinder
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div class="brand">
    FlatFinder
   </div>
   <nav>
    <a href="dashboard.html">
     Dashboard
    </a>
    <a href="search-flats.html">
     Find Flats
    </a>
    <a href="wishlist.html">
     Wishlist
    </a>
    <a href="inquiries.html">
     Inquiries
    </a>
    <a href="profile.html">
     Profile
    </a>
    <a href="#" onclick="logout()">
     Logout
    </a>
   </nav>
  </header>
  <main>
   <section class="panel">
    <h2>
     Reset Password (Demo)
    </h2>
    <p>
     Enter your registered email and choose a new password. A real application should verify identity through an email reset link.
    </p>
    <form onsubmit="resetPassword(event)">
     <div class="field">
      <label>
       Registered Email
      </label>
      <input id="email" required="" type="email"/>
     </div>
     <div class="field">
      <label>
       New Password
      </label>
      <input id="password" minlength="6" required="" type="password"/>
     </div>
     <p id="msg">
     </p>
     <button>
      Reset Password
     </button>
    </form>
   </section>
  </main>
  <footer>
   FlatFinder Customer Module · Academic frontend demonstration
  </footer>
  <script src="js/app.js">
  </script>
 </body>
</html>
