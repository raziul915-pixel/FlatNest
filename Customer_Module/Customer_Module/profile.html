<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   My Profile | FlatFinder
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div class="brand">
    FlatFinder
   </div>
   <nav>
    <a href="dashboard.html">
     Dashboard
    </a>
    <a href="search-flats.html">
     Find Flats
    </a>
    <a href="wishlist.html">
     Wishlist
    </a>
    <a href="inquiries.html">
     Inquiries
    </a>
    <a href="profile.html">
     Profile
    </a>
    <a href="#" onclick="logout()">
     Logout
    </a>
   </nav>
  </header>
  <main>
   <section class="panel">
    <h2>
     My Profile
    </h2>
    <img alt="Profile picture" class="avatar" id="avatar" src="https://placehold.co/120x120?text=Profile"/>
    <div class="field">
     <label>
      Upload Profile Picture
     </label>
     <input accept="image/*" onchange="uploadPhoto(event)" type="file"/>
    </div>
    <form onsubmit="saveProfile(event)">
     <div class="field">
      <label>
       Name
      </label>
      <input id="name" required=""/>
     </div>
     <div class="field">
      <label>
       Email (cannot be changed here)
      </label>
      <input disabled="" id="email" type="email"/>
     </div>
     <div class="field">
      <label>
       Phone
      </label>
      <input id="phone"/>
     </div>
     <div class="field">
      <label>
       Address
      </label>
      <textarea id="address"></textarea>
     </div>
     <p id="msg">
     </p>
     <button>
      Save Profile
     </button>
    </form>
   </section>
   <section class="panel">
    <h2>
     Change Password
    </h2>
    <form onsubmit="changePassword(event)">
     <div class="field">
      <label>
       Current Password
      </label>
      <input id="oldPassword" required="" type="password"/>
     </div>
     <div class="field">
      <label>
       New Password
      </label>
      <input id="newPassword" minlength="6" required="" type="password"/>
     </div>
     <p id="passMsg">
     </p>
     <button>
      Change Password
     </button>
    </form>
   </section>
   <section class="panel">
    <h2>
     Delete Account
    </h2>
    <p>
     This removes this demo account and its local wishlist and inquiry records.
    </p>
    <button class="danger" onclick="deleteAccount()">
     Delete My Account
    </button>
   </section>
  </main>
  <footer>
   FlatFinder Customer Module · Academic frontend demonstration
  </footer>
  <script src="js/app.js">
  </script>
  <script>
   profile();
  </script>
 </body>
</html>
