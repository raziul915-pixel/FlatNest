<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Login | FlatFinder
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div class="brand">
    FlatFinder
   </div>
   <nav>
    <a href="dashboard.html">
     Dashboard
    </a>
    <a href="search-flats.html">
     Find Flats
    </a>
    <a href="wishlist.html">
     Wishlist
    </a>
    <a href="inquiries.html">
     Inquiries
    </a>
    <a href="profile.html">
     Profile
    </a>
    <a href="#" onclick="logout()">
     Logout
    </a>
   </nav>
  </header>
  <main>
   <section class="panel">
    <h2>
     Customer Login
    </h2>
    <form onsubmit="login(event)">
     <div class="field">
      <label>
       Email
      </label>
      <input id="email" required="" type="email"/>
     </div>
     <div class="field">
      <label>
       Password
      </label>
      <input id="password" required="" type="password"/>
     </div>
     <p id="msg">
     </p>
     <button>
      Login
     </button>
    </form>
    <p>
     <a href="reset-password.html">
      Forgot / Reset Password?
     </a>
     ·
     <a href="register.html">
      Create account
     </a>
    </p>
   </section>
  </main>
  <footer>
   FlatFinder Customer Module · Academic frontend demonstration
  </footer>
  <script src="js/app.js">
  </script>
 </body>
</html>
